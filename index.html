<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1eb" />
  <meta name="description" content="Do Stuff v2.7.1：视觉与交互设计规范 V1.1 落实版" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Do Stuff · v2.7.1 · V1.1</title>
  <style>h1{color:#d32f2f}</style>
  <script>
    (()=>{
      const isPreview=location.hostname.endsWith(".github.io");
      const nonce=Date.now().toString(36);
      const asset=path=>isPreview?`${path}?v=${nonce}`:path;
      window.__DST_ASSET__=asset;
      window.__DST_STYLES_READY__=Promise.all(
        ["styles-1.css","styles-2.css"].map(path=>new Promise((resolve,reject)=>{
          const link=document.createElement("link");
          link.rel="stylesheet";
          link.href=asset(path);
          link.onload=resolve;
          link.onerror=reject;
          document.head.appendChild(link);
        }))
      );
    })();
  </script>
  <style>
    .task{isolation:isolate}
    .task:hover{background:transparent}
    .task::before{
      content:"";
      position:absolute;
      inset:4px 0;
      z-index:0;
      border-radius:10px;
      background:transparent;
      pointer-events:none;
      transition:background-color .18s ease;
    }
    .task:not(:has(.task-meta))::before{
      inset:-1px 0;
    }
    .task:hover::before{
      background:color-mix(in srgb,var(--accent) 8%,var(--paper));
    }
    :root[data-theme="dark"] .task:hover::before{
      background:color-mix(in srgb,var(--accent) 18%,var(--paper));
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]) .task:hover::before{
        background:color-mix(in srgb,var(--accent) 18%,var(--paper));
      }
    }
    .task>*{position:relative;z-index:1}
    .check{
      width:27px;
      height:27px;
      margin-left:3px;
      border:0;
      background:transparent;
      color:var(--accent-deep);
      position:relative;
      font-size:12px;
      font-weight:600;
      line-height:1;
    }
    .check::before{
      content:"";
      width:21px;
      height:21px;
      border:1.3px solid var(--meta);
      border-radius:50%;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      background:transparent;
      transition:border-color .16s ease,background-color .16s ease,transform .16s ease;
    }
    .check:hover{background:transparent}
    .check:hover::before{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
    .check.done{
      background:transparent;
      border-color:transparent;
      color:transparent;
      font-size:0;
    }
    .check.done::before{
      background:color-mix(in srgb,var(--accent) 7%,transparent);
      border:1.7px solid var(--accent);
      transform:translate(-50%,-50%) scale(.98);
    }
    .check.done::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:7px;
      height:4px;
      border-left:1.45px solid var(--accent-deep);
      border-bottom:1.45px solid var(--accent-deep);
      transform:translate(-48%,-62%) rotate(-45deg) scale(.88);
      transform-origin:center;
      opacity:1;
      pointer-events:none;
      animation:checkIn .16s ease-out;
    }
    .completed-mark{
      width:27px;
      height:27px;
      min-width:27px;
      border:0;
      border-radius:0;
      background:transparent;
      color:transparent;
      font-size:0;
      position:relative;
      display:block;
    }
    .completed-mark::before{
      content:"";
      width:21px;
      height:21px;
      border:1.7px solid var(--accent);
      border-radius:50%;
      background:color-mix(in srgb,var(--accent) 7%,transparent);
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%) scale(.98);
    }
    .completed-mark::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:7px;
      height:4px;
      border-left:1.45px solid var(--accent-deep);
      border-bottom:1.45px solid var(--accent-deep);
      transform:translate(-48%,-62%) rotate(-45deg) scale(.88);
      transform-origin:center;
      pointer-events:none;
    }
    @keyframes checkIn{
      from{opacity:0;transform:translate(-48%,-62%) rotate(-45deg) scale(.62)}
      to{opacity:1;transform:translate(-48%,-62%) rotate(-45deg) scale(.88)}
    }
    .task-title{font-size:14.5px}
    .pin,.task-more{
      border-radius:999px;
      transition:background-color .16s ease,color .16s ease,opacity .16s ease;
    }
    .pin:hover,.task-more:hover{
      background:color-mix(in srgb,var(--accent) 10%,var(--paper));
      color:var(--accent-deep);
    }
    .next-preview-list{
      margin-top:8px;
      padding:1px 0 0 2px;
      display:flex;
      flex-direction:column;
      gap:5px;
    }
    .next-preview-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:14px;
      align-items:baseline;
      min-width:0;
      padding:2px 0;
    }
    .next-preview-title{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:11.8px;
      line-height:1.55;
      color:var(--meta);
      font-weight:400;
    }
    .next-preview-meta{
      white-space:nowrap;
      font-size:10.4px;
      line-height:1.55;
      color:var(--input-placeholder);
      font-variant-numeric:tabular-nums;
    }
    #todayList{
      max-height:350px;
      overflow-y:auto;
      overflow-x:hidden;
      overscroll-behavior:contain;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }
    #todayList>.task{
      flex:0 0 auto;
      height:auto;
    }
    #todayList::-webkit-scrollbar{
      display:none;
      width:0;
      height:0;
    }
    .completed-section{
      margin-top:0;
    }
    @media (min-width:648px){
      .manage-area{
        min-height:0;
        overflow:hidden;
      }
      .manage-scroll{
        flex:1 1 0;
        min-height:0;
        overflow-y:auto;
        overflow-x:hidden;
        overscroll-behavior:contain;
      }
    }
  </style>
</head>
<body>
  <script>
    (async()=>{
      await window.__DST_STYLES_READY__;
      const scripts=[
        "app-core-1.js","app-core-2.js",
        "app-tasks-1.js","app-tasks-2.js","app-tasks-3.js",
        "app-ui-1.js","app-ui-2.js","app-ui-3.js"
      ];
      for(const path of scripts){
        await new Promise((resolve,reject)=>{
          const script=document.createElement("script");
          script.src=window.__DST_ASSET__(path);
          script.async=false;
          script.onload=resolve;
          script.onerror=reject;
          document.body.appendChild(script);
        });
      }
      const brandTitle=document.querySelector(".brand-block h1");
      if(brandTitle) brandTitle.textContent="Do Stuff";
    })().catch(error=>console.error("DST preview asset load failed",error));
  </script>
</body>
</html>
