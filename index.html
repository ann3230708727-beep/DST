<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1eb" />
  <meta name="description" content="做点儿啥 v2.7.1：视觉与交互设计规范 V1.1 落实版" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>做点儿啥 · v2.7.1 · V1.1</title>
  <style>h1{color:#d32f2f}</style>
  <script>
    (()=>{
      const isPreview=location.hostname.endsWith(".github.io");
      const nonce=Date.now().toString(36);
      const asset=path=>isPreview?`${path}?v=${nonce}`:path;
      window.__DST_ASSET__=asset;
      window.__DST_STYLES_READY__=Promise.all(
        ["styles-1.css","styles-2.css"].map(path=>new Promise((resolve,reject)=>{
          const link=document.createElement("link");
          link.rel="stylesheet";
          link.href=asset(path);
          link.onload=resolve;
          link.onerror=reject;
          document.head.appendChild(link);
        }))
      );
    })();
  </script>
  <style>
    .task{isolation:isolate}
    .task:hover{background:transparent}
    .task::before{
      content:"";
      position:absolute;
      inset:4px 0;
      z-index:0;
      border-radius:10px;
      background:transparent;
      pointer-events:none;
      transition:background-color .18s ease;
    }
    .task:hover::before{
      background:color-mix(in srgb,var(--accent) 8%,var(--paper));
    }
    :root[data-theme="dark"] .task:hover::before{
      background:color-mix(in srgb,var(--accent) 18%,var(--paper));
    }
    @media (prefers-color-scheme:dark){
      :root:not([data-theme="light"]) .task:hover::before{
        background:color-mix(in srgb,var(--accent) 18%,var(--paper));
      }
    }
    .task>*{position:relative;z-index:1}
    .pin,.task-more{
      border-radius:999px;
      transition:background-color .16s ease,color .16s ease,opacity .16s ease;
    }
    .pin:hover,.task-more:hover{
      background:color-mix(in srgb,var(--accent) 10%,var(--paper));
      color:var(--accent-deep);
    }
  </style>
</head>
<body>
  <script>
    (async()=>{
      await window.__DST_STYLES_READY__;
      const scripts=[
        "app-core-1.js","app-core-2.js",
        "app-tasks-1.js","app-tasks-2.js","app-tasks-3.js",
        "app-ui-1.js","app-ui-2.js","app-ui-3.js"
      ];
      for(const path of scripts){
        await new Promise((resolve,reject)=>{
          const script=document.createElement("script");
          script.src=window.__DST_ASSET__(path);
          script.async=false;
          script.onload=resolve;
          script.onerror=reject;
          document.body.appendChild(script);
        });
      }
      const brandTitle=document.querySelector(".brand-block h1");
      if(brandTitle) brandTitle.textContent="做点儿啥v2.7.1";
    })().catch(error=>console.error("DST preview asset load failed",error));
  </script>
</body>
</html>
